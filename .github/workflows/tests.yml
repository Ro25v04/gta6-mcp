name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6     # installs uv
      - run: uv sync --locked           # same packages as uv.lock
      - run: uv run pytest -q           # all tests, no internet needed
